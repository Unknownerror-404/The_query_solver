version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: sih26_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${CIVIC_MAP_DB_PASSWORD:-Mi123456#}
      MYSQL_DATABASE: ${CIVIC_MAP_DB_NAME:-sih26}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  web:
    build: .
    container_name: sih26_web
    restart: always
    ports:
      - "8000:8000"
    environment:
      CIVIC_MAP_DB_HOST: db
      CIVIC_MAP_DB_PORT: 3306
      CIVIC_MAP_DB_USER: root
      CIVIC_MAP_DB_PASSWORD: ${CIVIC_MAP_DB_PASSWORD:-Mi123456#}
      CIVIC_MAP_DB_NAME: ${CIVIC_MAP_DB_NAME:-sih26}
    depends_on:
      - db

volumes:
  mysql_data:

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Industry Administration · Civic Map</title>
<link rel="stylesheet" href="/templates/shared.css">
<style>
:root{--admin-bg:#f5f1e8;--admin-card:#fffdf8;--admin-line:#dddcd4;--admin-muted:#667773;--admin-accent:#e65f38;--admin-blue:#317c91;--admin-green:#173b36}
*{box-sizing:border-box}
body{margin:0;background:var(--admin-bg);color:var(--ink);font-family:Inter,Arial,sans-serif}
header{display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap}
main{max-width:1150px}
.industry-admin-shell{display:grid;gap:24px}
.admin-intro{padding:34px 36px;border-radius:20px;background:linear-gradient(135deg,#173b36,#24534b);color:#fff;box-shadow:0 14px 35px rgba(23,59,54,.15)}
.admin-intro .eyebrow{color:#f28b68}
.admin-intro h1{margin:7px 0 9px;font:500 clamp(32px,4vw,45px)/1.08 Georgia,serif}
.admin-intro>p:last-child{max-width:780px;margin:0;color:#c9d9d5;font:14px/1.65 Arial,sans-serif}
.admin-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.admin-stats>div{padding:20px 22px;border:1px solid var(--admin-line);border-radius:15px;background:var(--admin-card);box-shadow:0 6px 18px rgba(23,43,40,.06)}
.admin-stats strong{display:block;font:700 28px/1 Inter,Arial,sans-serif}
.admin-stats span{display:block;margin-top:6px;color:var(--admin-muted);font:11px/1.3 Arial,sans-serif}
.admin-section{position:relative;padding:26px;border:1px solid var(--admin-line);border-radius:16px;background:var(--admin-card);box-shadow:0 7px 20px rgba(23,43,40,.06);overflow:hidden}
.admin-section:before{content:'';position:absolute;left:0;right:0;top:0;height:4px;background:linear-gradient(90deg,var(--admin-blue),#c48622,var(--admin-accent))}
.section-heading{display:flex;align-items:end;justify-content:space-between;gap:15px;margin-bottom:18px}
.eyebrow{margin:0 0 6px;color:var(--admin-accent);font:800 9px/1.2 Arial,sans-serif;letter-spacing:1.6px;text-transform:uppercase}
.admin-section h2{margin:0;font:500 26px/1.2 Georgia,serif}
.queue-label{padding:6px 9px;border-radius:999px;background:#edf5f2;color:#237461;font:700 10px Arial,sans-serif}
.partner-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.partner-card,.commitment-card{position:relative;padding:20px;border:1px solid var(--admin-line);border-radius:13px;background:#fff;box-shadow:0 5px 15px rgba(23,43,40,.04)}
.partner-card:hover,.commitment-card:hover{border-color:#b9c9c3;box-shadow:0 10px 24px rgba(23,43,40,.08)}
.partner-heading{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.partner-card h3{margin:0 0 6px;font:700 19px/1.2 Inter,Arial,sans-serif}
.partner-card p{margin:5px 0;color:var(--admin-muted);font:13px/1.5 Arial,sans-serif}
.approval-badge{padding:6px 9px;border-radius:999px;font:800 9px Arial,sans-serif;white-space:nowrap;text-transform:uppercase}
.approval-active{background:#e8f5ef;color:#23755f}.approval-pending{background:#fff4dc;color:#a66d15}.approval-rejected{background:#fdeceb;color:#b43d35}
.partner-meta{margin:17px 0!important;padding-top:15px;border-top:1px solid #e7ebe8}
.approval{display:flex;align-items:end;gap:10px;flex-wrap:wrap}
.approval label{flex:1;min-width:180px;margin:0;color:var(--ink);font:800 9px Arial,sans-serif;letter-spacing:1px;text-transform:uppercase}
.approval select{margin-top:7px}
select,input{width:100%;padding:10px 11px;border:1px solid #cdd8d3;border-radius:8px;background:#fff;color:var(--ink);font:13px Arial,sans-serif}
button{padding:10px 15px;border:1px solid var(--admin-green);border-radius:8px;background:var(--admin-green);color:#fff;cursor:pointer;font:700 11px Arial,sans-serif;transition:.18s ease}
button:hover{transform:translateY(-1px);box-shadow:0 7px 16px rgba(23,59,54,.14)}
.commitment-list{display:grid;gap:12px}
.commitment-card form{display:flex;gap:8px;align-items:center;margin-top:12px}
.commitment-card select{width:170px}.commitment-card input{flex:1}
.admin-form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.admin-form input,.admin-form select{min-width:0}
.admin-form button{grid-column:1/-1;justify-self:start;min-width:170px}
.empty-state{padding:18px;border:1px dashed #cbd6d1;border-radius:11px;color:var(--admin-muted);font:13px/1.5 Arial,sans-serif}
@media(max-width:800px){.partner-grid,.admin-stats{grid-template-columns:1fr}.commitment-card form{flex-direction:column;align-items:stretch}.commitment-card select{width:100%}.admin-form{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
<div class="brand"><div class="brand-mark">G</div><div><div class="brand-name">Civic Map</div><div class="brand-sub">Industry Administration</div></div></div>
<div class="tagline">Admin workspace · <a href="/logout" style="color:var(--muted)">Log out</a></div>
<nav class="nav"><a class="nav-button" href="/admin">Moderation</a><a class="nav-button active" href="/industry-admin">Industry</a><a class="nav-button" href="/universities">Universities</a><a class="nav-button" href="/government-dashboard">Analytics</a></nav>
</header>
<main>
__CONTENT__
</main>
<script>
document.querySelector('.industry-create').onsubmit=async event=>{event.preventDefault();const response=await fetch('/api/admin/industry-partners',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(new FormData(event.target)))});if(response.ok)location.reload();else alert((await response.json()).message||'Registration failed')};
document.querySelectorAll('.offer-update').forEach(form=>form.onsubmit=async event=>{event.preventDefault();const response=await fetch('/api/admin/offer-commitments',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(new FormData(form)))});if(response.ok)location.reload();else alert((await response.json()).message||'Commitment update failed')});
document.querySelectorAll('.approval').forEach(form=>form.onsubmit=async event=>{event.preventDefault();const response=await fetch('/api/admin/institutions/'+form.dataset.kind+'/'+form.dataset.id+'/approval',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(new FormData(form)))});if(response.ok)location.reload();else alert((await response.json()).message||'Approval update failed')});
</script>
</body>
</html>

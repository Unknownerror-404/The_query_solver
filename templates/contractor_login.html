<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Contractor Login · Civic Map</title>
<meta name="description" content="Sign in to the Jharkhand Civic Map contractor portal to view your assigned projects and update work status.">
<link rel="stylesheet" href="/templates/shared.css">
<style>
body {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 40px 16px;
  background: linear-gradient(135deg, #f7f3ea 0%, #eee9dc 50%, #e8f4f1 100%);
  font-family: Georgia, serif;
}
.login-card {
  position: relative;
  overflow: hidden;
  width: 100%;
  max-width: 420px;
  padding: 40px 40px 44px;
  border: 1px solid var(--line);
  border-radius: 20px;
  background: rgba(255, 253, 248, .94);
  backdrop-filter: blur(12px);
  box-shadow: 0 24px 64px rgba(23, 43, 40, .16);
}
.login-card::before {
  content: "";
  position: absolute;
  top: 0; left: 0; right: 0; height: 5px;
  background: linear-gradient(90deg, #e65f38, #c48622, #317c91);
}
.brand-row {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 28px;
}
.brand-mark {
  width: 46px; height: 46px;
  display: grid; place-items: center;
  border-radius: 12px;
  background: var(--ink);
  color: white;
  font: 700 18px Arial, sans-serif;
  box-shadow: 0 6px 18px rgba(23,43,40,.2);
}
.brand-text .name { font: 700 16px Arial, sans-serif; }
.brand-text .sub {
  margin-top: 2px;
  color: var(--accent);
  font: 700 9px Arial, sans-serif;
  letter-spacing: 1.6px;
  text-transform: uppercase;
}
h1 { margin: 0 0 4px; font-size: 30px; font-weight: 500; letter-spacing: -.8px; }
.sub { margin: 0 0 28px; color: var(--muted); font: 14px/1.5 Arial, sans-serif; }
.field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 16px; }
label { font: 700 10px Arial, sans-serif; letter-spacing: 1.2px; text-transform: uppercase; color: var(--muted); }
input {
  padding: 12px 14px;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: rgba(255,255,255,.9);
  color: var(--ink);
  font: 14px Arial, sans-serif;
  transition: border-color .2s, box-shadow .2s;
  outline: none;
}
input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(230,95,56,.12); }
.submit-btn {
  width: 100%; margin-top: 8px; padding: 14px;
  border: 0; border-radius: 10px;
  background: var(--ink); color: white;
  font: 700 14px Arial, sans-serif; letter-spacing: .4px;
  cursor: pointer;
  transition: background .2s, transform .15s, box-shadow .2s;
  box-shadow: 0 6px 18px rgba(23,43,40,.18);
}
.submit-btn:hover { background: var(--ink-soft); transform: translateY(-2px); box-shadow: 0 10px 26px rgba(23,43,40,.22); }
.message { margin-bottom: 18px; padding: 12px 16px; border-radius: 10px; font: 14px/1.5 Arial, sans-serif; }
.error { background: #fce8e6; color: var(--danger); border: 1px solid #f5c6c4; }
.links {
  margin-top: 20px;
  display: flex;
  flex-direction: column;
  gap: 6px;
  text-align: center;
  font: 13px Arial, sans-serif;
  color: var(--muted);
}
.links a { color: var(--accent); text-decoration: none; font-weight: 700; }
.links a:hover { text-decoration: underline; }
</style>
</head>
<body>
<div class="login-card">
  <div class="brand-row">
    <div class="brand-mark">C</div>
    <div class="brand-text">
      <div class="name">Civic Map</div>
      <div class="sub">Contractor Portal</div>
    </div>
  </div>
  <h1>Contractor Sign In</h1>
  <p class="sub">Access your assigned projects and update work progress.</p>
  __MESSAGE__
  <form method="POST" action="/contractor/login">
    <div class="field">
      <label for="email">Email Address</label>
      <input id="email" name="email" type="email" required autocomplete="email" placeholder="your@company.com">
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input id="password" name="password" type="password" required autocomplete="current-password" placeholder="Your password">
    </div>
    <button id="contractor-login-submit" class="submit-btn" type="submit">Sign In to Dashboard</button>
  </form>
  <div class="links">
    <span>New contractor? <a href="/contractor/register">Register here</a></span>
    <span><a href="/login">Citizen login</a> &nbsp;·&nbsp; <a href="/university/login">University login</a></span>
  </div>
</div>
</body>
</html>
